name: Apply Event Links From Issue

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled

permissions:
  contents: write
  issues: write

jobs:
  apply-event-links:
    if: contains(github.event.issue.labels.*.name, 'event-links') || startsWith(github.event.issue.title, 'Event links:')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          pixi-version: v0.42.1
          cache: false

      - name: Save issue body
        run: |
          cat > issue-body.md << 'EOF'
          ${{ github.event.issue.body }}
          EOF

      - name: Apply event links to redirects.json
        id: apply
        run: |
          OUTPUT=$(pixi run python scripts/apply_event_from_issue.py --issue-body issue-body.md --redirects redirects.json)
          echo "$OUTPUT"
          while IFS='=' read -r key value; do
            if [ -n "$key" ]; then
              echo "$key=$value" >> "$GITHUB_OUTPUT"
            fi
          done <<< "$OUTPUT"

      - name: Regenerate redirect HTML files
        run: pixi run update-redirects

      - name: Commit and push updates
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A redirects.json r qr
          git commit -m "chore: update links for ${{ steps.apply.outputs.event_slug }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const changed = '${{ steps.commit.outputs.changed }}' === 'true';
            const slug = '${{ steps.apply.outputs.event_slug }}';
            const paths = '${{ steps.apply.outputs.updated_paths }}'
              .split(',')
              .filter(Boolean)
              .map((p) => `- ${p}`)
              .join('\n');

            const body = changed
              ? `Updated event links for **${slug}** and committed the generated redirect files.\n\nUpdated paths:\n${paths}`
              : `No file changes were needed for **${slug}**.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Close issue after success
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed',
            });