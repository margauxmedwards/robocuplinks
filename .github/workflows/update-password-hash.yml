name: Update admin password hash

# Run this manually after setting or changing the ADMIN_PASSWORD secret.
# It computes SHA-256 of the secret and embeds the hash into index.html
# so the admin page can verify the password client-side without a backend.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject SHA-256 hash of ADMIN_PASSWORD into index.html
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          HASH=$(printf '%s' "$ADMIN_PASSWORD" | sha256sum | cut -d' ' -f1)
          sed -i "s/var ADMIN_HASH = '[^']*'/var ADMIN_HASH = '$HASH'/" index.html

      - name: Commit updated hash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet && echo "Hash unchanged, nothing to commit." || \
            git commit -m "chore: update admin password hash [skip ci]" && git push
