name: Update Redirect Links

on:
  push:
    paths:
      - redirects.json
      - requirements.txt
      - scripts/update_redirects.py
      - .github/workflows/update-redirect-links.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-redirects:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate redirect files
        run: python scripts/update_redirects.py --config redirects.json

      - name: Commit generated updates
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update redirect links"
          git push